{{define "content"}}
<h1 class="text-xl font-semibold">Edit goal</h1>
{{if .Error}}<p class="text-red-400">{{.Error}}</p>{{end}}
<form class="flex flex-col gap-3" method="post" action="/goals/{{.Goal.ID}}/edit">
  <input name="title" placeholder="Title" value="{{.GoalForm.Title}}" required>
  <input name="target" inputmode="numeric" placeholder="Target (optional)" value="{{.GoalForm.Target}}">
  <label><input type="checkbox" name="couple"{{if .GoalForm.Couple}} checked{{end}}> Couple goal</label>
  <select name="visibility">
    {{range .Visibilities}}<option value="{{.}}"{{if eq . $.GoalForm.Visibility}} selected{{end}}>{{.}}</option>{{end}}
  </select>
  <button type="submit">Save changes</button>
</form>
<p><a href="/goals/{{.Goal.ID}}">Cancel</a></p>
{{end}}
