{{define "content"}}
<a class="backlink" href="/catalog">← Volver al catálogo</a>
<div class="page-head">
  <div><p class="eyebrow">Catálogo</p><h1>Nuevo título</h1></div>
</div>
{{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
<form class="form-page" method="post" action="/catalog">
  <div class="field"><label for="title">Título</label><input class="input" id="title" name="title" value="{{.Form.Title}}" required autofocus></div>
  <div class="form-row">
    <div class="field"><label for="kind">Tipo</label><select class="input" id="kind" name="kind">{{range .Kinds}}<option value="{{.}}"{{if eq . $.Form.Kind}} selected{{end}}>{{template "ui-kind" .}}</option>{{end}}</select></div>
    <div class="field"><label for="year">Año (opcional)</label><input class="input" id="year" name="year" inputmode="numeric" value="{{.Form.Year}}"></div>
  </div>
  <div class="field"><label for="external_id">Id externo (opcional)</label><input class="input" id="external_id" name="external_id" value="{{.Form.ExternalID}}"></div>
  <label class="check"><input type="checkbox" name="personal" value="1"{{if .Form.Personal}} checked{{end}}> Personal (solo yo puedo verlo)</label>
  <div class="form-actions">
    <a class="btn btn-secondary" href="/catalog">Cancelar</a>
    <button class="btn btn-primary" type="submit">Crear título</button>
  </div>
</form>
{{end}}
