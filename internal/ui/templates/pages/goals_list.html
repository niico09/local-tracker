{{define "content"}}
<div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <h1 class="text-xl font-semibold sm:text-2xl">Goals</h1>
  <a class="text-emerald-400 hover:text-emerald-300" href="/goals/new">Add goal</a>
</div>
{{if .Error}}<p class="text-red-400">{{.Error}}</p>{{end}}
<ul class="flex flex-col gap-3">
{{range .Goals}}
  <li class="flex flex-col gap-1 rounded border border-slate-800 p-3 sm:flex-row sm:items-center sm:gap-4">
    <a class="font-medium hover:text-emerald-300" href="/goals/{{.ID}}">{{.Title}}</a>
    <span class="text-sm text-slate-400">{{if .OwnerUserID}}personal{{else}}couple{{end}}</span>
    <span class="text-sm text-slate-400">{{.Visibility}}</span>
    {{if .Target}}<span class="text-sm text-slate-400">target {{.Target}}</span>{{end}}
  </li>
{{else}}
  <li class="text-slate-400">No goals yet.</li>
{{end}}
</ul>
{{end}}
